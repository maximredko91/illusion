name: FFmpeg для Android

# Только ручной запуск: .so коммитятся в репозиторий, пересобирать их нужно лишь при смене
# версии FFmpeg или состава кодеков в scripts/build_ffmpeg_android.sh.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Та же версия NDK, что AGP 9.3.2 берёт по умолчанию для JNI-обёртки в самом приложении.
      - name: Android NDK r28c
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo "a7b54a5de87fecd125a17d54f73c446199e72a64  ndk.zip" | sha1sum -c -
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r28c" >> "$GITHUB_ENV"

      - name: Сборка FFmpeg
        run: bash scripts/build_ffmpeg_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: ffmpeg-android
          if-no-files-found: error
